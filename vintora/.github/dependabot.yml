version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    labels:
      - ci
      - dependencies

  # Dockerfile and docker-compose.yml base images are digest-pinned in
  # config/artifact-policy.json. Dependabot opens the update PR; the PR must
  # also refresh the matching digest in that policy before CI can pass.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      container-images:
        patterns:
          - "*"
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - containers
