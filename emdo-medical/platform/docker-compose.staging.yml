name: emdo-staging

# Provider-neutral staging topology. Configuration only: no hosted environment
# is provisioned by this file. Binds to loopback; expose only behind reviewed
# HTTPS ingress with authentication, MFA and rate limiting (not implemented here).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emdo_staging}
      POSTGRES_USER: ${POSTGRES_USER:-emdo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}
    volumes:
      - emdo-staging-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emdo_app} -d ${POSTGRES_DB:-emdo_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-emdo_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}@db:5432/${POSTGRES_DB:-emdo_staging}
      NODE_ENV: staging
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["node", "apps/api/dist/database/migrate.js"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-emdo_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}@db:5432/${POSTGRES_DB:-emdo_staging}
      NODE_ENV: staging
      PORT: 3000
      COUNTRY_PROFILE_MODE: sandbox
      AI_MODEL_BACKEND: offline
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    env_file:
      - .env.staging
    environment:
      INSIGHT_API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  emdo-staging-db:
