services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emdo_dev
      POSTGRES_USER: emdo_app
      POSTGRES_PASSWORD: emdo-local-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - emdo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emdo_app -d emdo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://emdo_app:emdo-local-dev@db:5432/emdo_dev
      NODE_ENV: development
      COUNTRY_PROFILE_MODE: sandbox
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  emdo-db-data:
