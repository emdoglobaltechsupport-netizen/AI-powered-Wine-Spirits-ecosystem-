name: CI - governance and documentation

# Phase 1 gates only. Green checks prove metadata parity and local controls;
# they are not legal, security, reliability or launch approval.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: vintora

jobs:
  governance:
    name: ADR, metadata, evidence, claims and documentation gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: vintora/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Check repository and ADR governance
        run: npm run policy:check && npm run adr:check

      - name: Check canonical metadata, evidence and fixture labels
        run: npm run canonical:check && npm run evidence:check && npm run fixtures:check

      - name: Check claims, status, retention and release gates
        run: npm run claims-change:check && npm run status:check && npm run retention:check

      - name: Check network isolation, Markdown links and config schemas
        run: npm run network:check && npm run markdown:check && npm run schemas:check

      - name: Check generated counts and documentation claims
        run: npm run test-counts:check && npm run claims:check && npm run docs:check
