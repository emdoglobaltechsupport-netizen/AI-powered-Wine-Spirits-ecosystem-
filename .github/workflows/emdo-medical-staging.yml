name: EMDO Medical staging artifacts

# Manual, provider-neutral validation only. This workflow builds and saves
# container artifacts; it does not deploy, publish images or promote maturity.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emdo-medical-staging-artifacts
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emdo-medical/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: emdo-medical/platform/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and unit tests
        env:
          DATA_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
          JWT_ACCESS_SECRET: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC
          JWT_REFRESH_SECRET: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMD
          NODE_ENV: test
          COUNTRY_PROFILE_MODE: sandbox
          SCRYPT_COST: 12
        run: |
          npm run typecheck
          npm test

      - name: Build prototype artefacts
        env:
          NODE_ENV: production
          COUNTRY_PROFILE_MODE: sandbox
          AI_MODEL_BACKEND: offline
        run: npm run build

      - name: Validate staging compose configuration
        run: |
          cp .env.staging.example .env.staging
          POSTGRES_PASSWORD=artifact-validation-only docker compose --env-file .env.staging -f docker-compose.staging.yml config --quiet

      - name: Build container artefacts
        run: |
          docker build -f Dockerfile -t emdo-api:staging-artifact .
          docker build -f apps/admin/Dockerfile -t emdo-admin:staging-artifact .
          docker save emdo-api:staging-artifact -o emdo-api-staging.tar
          docker save emdo-admin:staging-artifact -o emdo-admin-staging.tar

      - name: Upload container artefacts
        uses: actions/upload-artifact@v4
        with:
          name: emdo-medical-staging-artifacts
          path: |
            emdo-medical/platform/emdo-api-staging.tar
            emdo-medical/platform/emdo-admin-staging.tar
          if-no-files-found: error
          retention-days: 7
