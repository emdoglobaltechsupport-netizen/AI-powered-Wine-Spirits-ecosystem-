name: EMDO Medical API

on:
  push:
    paths:
      - 'emdo-medical/platform/**'
      - '.github/workflows/emdo-medical-api.yml'
  pull_request:
    paths:
      - 'emdo-medical/platform/**'
      - '.github/workflows/emdo-medical-api.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Test-only deterministic keys. Never use these outside CI.
      DATA_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      JWT_ACCESS_SECRET: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC
      JWT_REFRESH_SECRET: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMD
      NODE_ENV: test
      COUNTRY_PROFILE_MODE: sandbox
      SCRYPT_COST: 12
      TEST_DATABASE_URL: postgres://emdo_app:emdo-local-dev@127.0.0.1:5432/emdo_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emdo_test
          POSTGRES_USER: emdo_app
          POSTGRES_PASSWORD: emdo-local-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emdo_app -d emdo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: emdo-medical/platform/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: emdo-medical/platform
      - run: npm run typecheck
        working-directory: emdo-medical/platform
      - run: npm run build
        working-directory: emdo-medical/platform
      - run: npm test
        working-directory: emdo-medical/platform
      - run: npm run test:e2e
        working-directory: emdo-medical/platform
